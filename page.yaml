# page.yaml: the words on your page, kept as data like everything else.
# make_page.py puts each answer under its question. A few sentences each, in your own words;
# leave a blank line between paragraphs. Refer to YOUR network and YOUR evidence.
# Never put your name or full student ID here: the page is public.

repository: https://github.com/jqc-lgtm/netlab

answers:
  planes:
    question: "Where are the data, control and management planes in your network?"
    answer: |
      The data plane is my three Linux bridges, s1, s2 and s3, which forward every frame using MAC tables they fill in themselves (macs.txt). There is no separate control plane: build_topo.py runs with controller=None, and no routing protocol or spanning tree runs, so all decisions come from the bridges' own flood-and-learn. That is also why my tree has to stay loop-free. The management plane is me and my scripts: topology.yaml as the source of truth, build_topo.py and make_page.py, and the commands I typed at the mininet> prompt.

  learning:
    question: "How did your switches learn which port leads to each host? Use your MAC table evidence."
    answer: |
      They learned by themselves, from the source MAC of each frame they saw during pingall. The first ARP broadcasts were flooded everywhere, and each frame taught every bridge on its path where its sender was. macs.txt shows that s1, which has no hosts of its own, put h1-h3 (00:00:00:00:00:01-03) behind port 1, the link to s2, and h4-h6 (:04-:06) behind port 2, the link to s3. So the core only knows which branch of the tree a host is on, and the ageing timers of about 4-5 seconds show the entries were just refreshed by traffic.

  kind:
    question: "Which of the four kinds of programmability is this assignment (a network described as data, then built and documented by scripts)? Why isn't it any of the other three?"
    answer: |
      It is (d), automated configuration management: my network is written once as data in topology.yaml, kept in Git, checked by check(), and then turned into both a running network and this page by scripts. It isn't (a), because packet processing never changes: the bridges are stock Linux bridges with no P4. It isn't (b), because there is no controller or OpenFlow, and forwarding is still decided locally by MAC learning. And it isn't (c), because I never use a device API such as NETCONF, RESTCONF or gNMI, or a YANG model.

  two_am:
    question: "Week 1's 2 a.m. change on 40 switches: what would be different if those switches were described like your network?"
    answer: |
      The SNMP change would be one edit to one file instead of 40 SSH sessions. git diff would show exactly the line that changed, a check() step could reject bad data before anything is pushed, and the same script would apply it identically to all 40 switches, so per-device typos and drift disappear. If it went wrong, git revert brings back the last good version. The catch is that a mistake in the data is now copied to all 40 at once, so checking the data matters even more.

  model:
    question: "What's the difference between your network's data model and its serialisation? Use YAML and JSON as the example."
    answer: |
      The data model is the structure: a list of switches, a list of hosts each with a name, IPv4 and IPv6 address, and a list of links joining two nodes. topology.yaml and topology.json are two serialisations of that same model, and building from either gave the same network: 3 switches, 6 hosts, 8 links, and 30/30 in pingall. What the JSON lost is the comments: my YAML explains the two-tier design and why it must stay loop-free, and the JSON has none of that.

  check:
    question: "Why is it better to catch bad data in check() than with pingall? What did IPv6 notice about a duplicate address that IPv4 didn't?"
    answer: |
      pingall only tests symptoms after the broken network is built: with h4 duplicating h2 it still reported 11/12, so the network looked almost healthy. check() reads the data first and names the exact problem, as check.txt shows for bad.yaml: h5 and h2 sharing 10.8.0.2 and fd00:3308::2, and a link to s9, which doesn't exist. In dad.txt, IPv6's Duplicate Address Detection marked h2's copy of fd00:3308::1 as dadfailed, while IPv4 accepted the duplicate 10.8.0.1 without any warning.

  git:
    question: "What does your Git history give you that copying files into folders named topology-v2-final wouldn't?"
    answer: |
      My history records each step, from the starting topology to my own design, the checks, the evidence and the page, with what changed, when and why. git diff on "Add s2 and h4" shows exactly the six lines I added, while folders of copies only show that something is different somewhere. If a change breaks the network, I can find the commit that did it and revert just that one.
